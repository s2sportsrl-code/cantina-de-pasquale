<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171513"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cantina De Pasquale</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><div><small>CANTINA DE PASQUALE</small><h1>La mia cantina</h1></div><button id="exportBtn">Backup</button></header>
<section class="kpis"><div><span>Bottiglie</span><b id="total">51</b></div><div><span>Etichette</span><b id="labels">28</b></div><div><span>Priorità</span><b id="priority">2</b></div></section>
<nav><button class="active" data-view="cantina">🍷 Cantina</button><button data-view="ai">✨ Sommelier AI</button><button data-view="history">🕰 Storico</button></nav>
<section id="cantina" class="view">
<div class="filters"><input id="search" placeholder="Cerca vino o produttore…"><select id="type"><option>Tutti</option><option>Rosso</option><option>Bianchi e Bollicine</option></select></div>
<div class="legend"><span>🟡 Priorità</span><span>🟢 Apribile</span><span>🟠 Attendere</span></div><div id="list"></div></section>
<section id="ai" class="view hidden"><div class="panel"><h2>Sommelier AI</h2><p>Scouting di bottiglie medio/alte e da collezione.</p>
<label>Prezzo minimo €<input id="minPrice" type="number" value="50"></label><label>Sconto reale minimo %<input id="discount" type="number" value="25"></label>
<label class="check"><input id="collect" type="checkbox" checked> Privilegia bottiglie da collezione</label><button id="saveAI" class="primary">Salva criteri</button><p id="aiMsg"></p></div>
<div class="panel"><h3>Scouting web</h3><p class="muted">Predisposto per la fase successiva: confronto prezzi, annate, valore di mercato e notifiche.</p></div></section>
<section id="history" class="view hidden"><div class="panel"><h2>Bottiglie aperte</h2><div id="historyList"></div></div></section>
<div id="toast" class="toast hidden"></div></main><script src="app.js"></script></body></html>

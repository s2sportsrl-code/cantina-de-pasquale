name: Manual wine market pricing

on:
  workflow_dispatch:
    inputs:
      action:
        description: Run a no-write pilot, price only unvalued labels, or refresh all labels
        required: true
        type: choice
        options:
          - pilot
          - initialize
          - refresh
        default: pilot

permissions:
  contents: read
  actions: write

jobs:
  market-pricing:
    runs-on: ubuntu-latest
    environment: market-pricing
    timeout-minutes: 360
    env:
      SUPABASE_URL: https://lejoeywrtgxyoilrzrwg.supabase.co
      MARKET_REFRESH_GITHUB_TOKEN: ${{ secrets.MARKET_REFRESH_GITHUB_TOKEN }}
      MARKET_PRICING_ACTION: ${{ inputs.action }}
    steps:
      - name: Run market-pricing action and produce an aggregate summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import uuid

          def count(value):
              return value if isinstance(value, int) and not isinstance(value, bool) and value >= 0 else 0

          def post(endpoint, token, payload):
              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode(),
                  headers={
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=180) as response:
                  return json.loads(response.read())

          action = os.environ.get("MARKET_PRICING_ACTION", "")
          status = "failed"
          counts = {
              "tested": 0,
              "priced": 0,
              "unverifiable": 0,
              "updated": 0,
              "unchanged": 0,
              "errors": 0,
          }

          try:
              if action not in {"pilot", "initialize", "refresh"}:
                  raise ValueError("Invalid action")
              endpoint = os.environ["SUPABASE_URL"].rstrip("/") + "/functions/v1/market-refresh-github"
              token = os.environ.get("MARKET_REFRESH_GITHUB_TOKEN", "")
              if not token:
                  raise ValueError("Missing workflow token")

              if action == "pilot":
                  result = post(endpoint, token, {"action": "pilot"})
                  results = result.get("results", [])
                  if not isinstance(results, list):
                      raise ValueError("Invalid pilot response")
                  counts["tested"] = len(results)
                  for item in results:
                      item_status = item.get("status") if isinstance(item, dict) else None
                      if item_status == "priced":
                          counts["priced"] += 1
                      elif item_status == "unverifiable":
                          counts["unverifiable"] += 1
                      else:
                          counts["errors"] += 1
                  status = "completed" if counts["errors"] == 0 else "failed"
              else:
                  run_id = str(uuid.uuid4())
                  for _ in range(10000):
                      result = post(endpoint, token, {"action": action, "run_id": run_id})
                      summary = result.get("summary", {})
                      if isinstance(summary, dict):
                          for key in ("updated", "unchanged", "unverifiable", "errors"):
                              counts[key] = count(summary.get(key))
                      if result.get("busy"):
                          raise RuntimeError("Refresh is busy")
                      if result.get("failed"):
                          status = "failed"
                          break
                      if result.get("done"):
                          status = "completed"
                          break
                      time.sleep(1)
                  else:
                      raise RuntimeError("Batch limit exceeded")
          except Exception:
              status = "failed"
              counts["errors"] = max(1, counts["errors"])

          report_data = {
              "action": action if action in {"pilot", "initialize", "refresh"} else "unknown",
              "status": status,
              "pilot_without_price_writes": action == "pilot",
              "counts": counts,
          }
          markdown = [
              "# Wine market pricing summary",
              "",
              f"- Status: `{status}`",
              f"- Action: `{report_data['action']}`",
              f"- Pilot without price writes: `{'yes' if action == 'pilot' else 'no'}`",
              "",
              "| Tested | Priced | Unverifiable | Updated | Unchanged | Errors |",
              "|---:|---:|---:|---:|---:|---:|",
              f"| {counts['tested']} | {counts['priced']} | {counts['unverifiable']} | "
              f"{counts['updated']} | {counts['unchanged']} | {counts['errors']} |",
              "",
          ]
          with open("market-pricing-summary.json", "w", encoding="utf-8") as report:
              json.dump(report_data, report, ensure_ascii=True, separators=(",", ":"))
          with open("market-pricing-summary.md", "w", encoding="utf-8") as report:
              report.write("\n".join(markdown))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
              report.write("\n".join(markdown))

          if status != "completed":
              raise SystemExit("Market pricing execution failed; only aggregate status and counts were emitted.")
          PY
      - name: Upload aggregate market-pricing summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-pricing-summary
          path: |
            market-pricing-summary.md
            market-pricing-summary.json
          if-no-files-found: ignore
          retention-days: 30
